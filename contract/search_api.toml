# GIST Unified Search API — capability contract (ADR-352).
#
# Single source of truth for the cross-face search contract: the request
# options every face accepts, the match kinds it returns, the process exit
# codes it speaks, the ABI version, and the transports that realize it. The two
# importable faces — the Python package (`bindings/python/irregex`) and the
# standalone Rust crate (`bindings/rust`) — each mirror these constants, and a
# parity test in each asserts the mirror against this file (and the Rust/Python
# `version()` against the live binary), so the contract cannot silently drift
# from the engine in either language.
#
# This is a contract, not code: adding a request option here is a deliberate
# widening of the deep `SearchRequest` surface, reviewed as an interface change.

[meta]
name = "gist-unified-search"
# The version axes are deliberately DISTINCT — a change on one does not force a
# bump on the others, and each is pinned against a different live artifact:
#   • abi_version      → the C-ABI compatibility integer `src/root.zig abi()` /
#                        `irregex_abi_version()` return (mirrored + gated by the
#                        Python/Rust `ABI_VERSION` and the FFI loader). Additive
#                        C symbols (irregex_version) do NOT bump it; a breaking
#                        layout/signature change does. v2: the rung-3 match
#                        callback (irregex_match_fn) gained an i32 abort return.
#   • engine_version   → the engine semver (`src/root.zig version_string` /
#                        build.zig.zon `.version`; `irregex_version()`).
#   • protocol_version → the UDS resident wire protocol ([session] below).
#   • the persisted-format revisions → the trigram index and the kinship atlas
#                        (ATLS v3, see [irregex.lifecycle].atlas) carry their own
#                        magic/version in their headers, not here.
abi_version = 2
engine_version = "0.1.0"
package_dist = "billy-irregex"
package_import = "gist"

# How the one contract is carried to the engine. `subprocess` is authoritative
# today (ADR-352): safe by construction — a bad pattern exits the child, never
# the host. `uds` is the resident-session transport (ADR-352 rung 2.5): a
# per-repository `gist serve` daemon holds the corpus + trigram index warm in
# memory and answers eligible file-set requests over a length-prefixed
# Unix-domain-socket protocol, sidestepping the die()->exit hazard because the
# resident query kernels return errors instead of calling die(). `ffi` (in-proc
# C session) is the further rung: it shares that same error-returning resident
# engine, so a bad query surfaces as IRREGEX_STALE, never a dead host.
#
# Honesty note (status tokens are truthful about disk, not aspiration): both
# `subprocess` and `uds` are callable transports today. The `uds` resident stack
# is landed and verified end to end — the eligibility classifier
# (`src/runtime/session/request.zig`), the length-prefixed wire codec
# (`src/runtime/session/protocol.zig`), the warm error-returning engine
# (`src/runtime/session/resident.zig`), the fail-closed freshness watcher
# (`src/runtime/session/watch.zig`), the `gist serve` daemon accept-loop
# (`src/cli/gist/daemon/serve/serve.zig`), and the fail-open connecting client
# (`src/cli/gist/daemon/client/client.zig`, wired into the bare-`gist` front door in
# `src/cli/gist/main.zig`) — under an end-to-end lifecycle test
# (`src/cli/gist/daemon/serve/serve_test.zig`). The warm path is a pure accelerator that
# routes only what it can answer with cold's own per-file bytes and exit code
# (`-l`/files-with-matches and the bare default `lines` search, incl. `-n`;
# file order is the deterministic pathLess canonicalization of cold's parallel
# discovery order) and falls open to `subprocess` for everything else, so it is
# never a new source of truth or a new failure mode.
[transports]
subprocess = { status = "authoritative", detail = "certified `gist` binary + --json; results produced by the same combinePatterns->collectFiles->json.run path the CLI uses" }
uds = { status = "operational-accelerator", detail = "`gist serve` daemon holds a warm ResidentSession behind a Unix socket; the front-door client dials it for eligible queries (`-l`/files-with-matches, and the bare default `lines` search whose `path:[line:]text` bytes the daemon pre-renders through the cold Emitter and chunk-streams) and falls open to `subprocess` on any ineligible argv, TTY stdout, readable stdin, absent daemon, decline, or wire hiccup — a pure fail-open accelerator, never a distinct answer path (src/cli/gist/daemon/{serve,client}, src/runtime/session/*)" }
ffi = { status = "operational-accelerator", detail = "ABI 1 exposes one coherent open/search/close session. irregex_search accepts the complete size-checked options shape and streams typed records. src/runtime/ffi/contract.zig owns stable statuses, flags, options, and record layouts; relay.zig translates resident records; session.zig owns handle lifecycle and execution over the error-returning resident engine. A bad query returns IRREGEX_STALE, never a dead host. Options carry smart-case, explicit Unicode/ASCII mode, invert, before/after context, quiet, and per-file max-count; records explicitly distinguish match from context, while invert selections remain match records with zero submatches, byte-identical to cold JSON. Invert scans every live document because positive trigram candidates cannot soundly select negative lines. Zig's effectiveIgnoreCase and CompiledQuery unicode field remain the sole case/class authorities. Unlike rootless-only `uds` (files/count only), FFI streams full Match records and passes SearchRequest.paths as irregex_open roots; Python bounds and keys handles by (cwd, roots), so scopes cannot cross-contaminate. engine=auto optimistically tries linear FFI, then IRREGEX_STALE falls through to authoritative cold PCRE2. Session.run/files/count/absent route through cffi when available, falling open to `uds` or `subprocess` otherwise—a fail-open accelerator, never a distinct answer path. cffi stays optional. Verified by the C-ABI smoke and FFI-vs-cold parity tests." }

# Resident-session semantics for the `uds` transport (ADR-352 rung 2.5). A client
# opens a persistent connection to one daemon generation and issues many queries;
# the daemon carries three monotonic generations so a client can detect a rebuilt
# index or a restarted daemon and re-handshake. Not mirrored as package constants
# (no per-language drift risk — these govern the wire protocol the Zig daemon and
# its clients speak), but pinned here as the authoritative shape.
[session]
socket_env = "GIST_SESSION_SOCK"                 # override the default per-repo socket path
default_socket = ".local/gist-verify/gistd.sock"
protocol_version = 2                             # length-prefixed frame protocol (src/runtime/session/protocol.zig); v2 grew the query flags byte (smart_case bit 5, word bit 3, quiet bit 6, max_count bit 7 all live — bit 7 also writes a u64 LE cap immediately after the flags byte; invert bit 4 reserved) and the daemon FAILS CLOSED on any unimplemented bit (BadFrame -> decline -> cold)
# Monotonic generations carried in every READY/STATUS frame.
generations = [
  "daemon",
  "session",
  "index",
] # daemon boot id · per-connection id · published pair.gen
# The request shapes the resident fast path answers directly. Everything else
# (--json, context, --rank, replace, invert, multiline, explicit file lists,
# stdin, a TTY stdout) is unsupported on the fast path and falls back to the
# cold subprocess transport, byte-for-byte identically. The case family is
# fully eligible: `-i`, `-s`, and `-S` smart-case (the raw smart_case bit
# crosses the wire and the SESSION resolves it against the pattern via
# request.zig::effectiveIgnoreCase — clients never implement hasUpper). `-w`
# (word), `-q` (quiet — the existence early-halt) and `-m N` (max-count — the
# per-file cap, incl rg's `-m0` = match nothing) are eligible too, the session
# applying cold's exact rules. FFI additionally opens explicit paths as C root
# arrays and carries explicit Unicode/ASCII mode into the shared compile seam.
# `lines` is the bare default `path:text` search (`-n` for `path:line:text`),
# pre-rendered daemon-side through the cold Emitter and chunk-streamed; the
# CLI routes `files` and `lines` warm, while `count` stays a wire-only
# corpus-wide total for embedders (rg's `-c` is per-file, so the CLI answers
# it cold).
eligible_modes = [
  "files",
  "count",
  "lines",
] # -l (files-with-matches) · -c (matching-line count) · bare default line search
# Freshness is fail-closed: a query is answered from resident bytes only when the
# barrier proves the searched roots unchanged since the daemon's build anchor
# (a watcher-clean window); otherwise the daemon reconciles changed/new/deleted
# paths against the live filesystem before answering, preserving the invariant
# `resident matches == --no-index matches == rg matches`.
freshness = "fail-closed-reconcile"
watchers = [
  "inotify",
  "reconcile",
] # linux inotify accelerator; portable metadata-reconcile barrier

# The exact request surface the deep contract exposes. Each option maps to the
# rg-parity flag the engine already honors (see src/runtime/cold/argv/args.zig
# `flag_catalog`); the package lowers a SearchRequest into that argv. Only
# match-finding intent belongs here — presentation, ranking, stats, replace,
# and stdin remain CLI-only and are deliberately NOT contract options.
[request_options]
pattern = { type = "str", flag = "<positional>", detail = "the regex or literal to find" }
paths = { type = "list[str]", flag = "<positional>", detail = "roots to search; empty = the repo default roots" }
fixed = { type = "bool", flag = "-F", detail = "treat pattern as a literal string" }
ignore_case = { type = "bool", flag = "-i", detail = "Unicode case-insensitive by default; `unicode = false` selects ASCII folding" }
smart_case = { type = "bool", flag = "-S", detail = "Unicode-case-insensitive unless the pattern has uppercase text" }
word = { type = "bool", flag = "-w", detail = "match whole Unicode words by default; `unicode = false` selects ASCII boundaries" }
quiet = { type = "bool", flag = "-q", detail = "print nothing; exit 0 at the first match, 1 if none (an existence early-halt)" }
invert = { type = "bool", flag = "-v", detail = "select non-matching lines" }
globs = { type = "list[str]", flag = "-g", detail = "include/exclude globs (a leading ! excludes)" }
iglobs = { type = "list[str]", flag = "--iglob", detail = "case-insensitive include/exclude globs" }
types = { type = "list[str]", flag = "-t", detail = "restrict to a registered file type" }
not_types = { type = "list[str]", flag = "-T", detail = "exclude a registered file type" }
before = { type = "int", flag = "-B", detail = "lines of leading context" }
after = { type = "int", flag = "-A", detail = "lines of trailing context" }
context = { type = "int", flag = "-C", detail = "lines of context on both sides" }
max_count = { type = "int", flag = "-m", detail = "stop after N matching lines per file; rg's `-m0` matches nothing (exit 1). Python `None` = unset; the Rust builder's `0` = unlimited" }
max_depth = { type = "int", flag = "--max-depth", detail = "cap directory descent depth (0 = unlimited)" }
hidden = { type = "bool", flag = "--hidden", detail = "search hidden files/dirs" }
no_ignore = { type = "bool", flag = "--no-ignore", detail = "disable .gitignore/.ignore/.rgignore filtering" }
follow = { type = "bool", flag = "-L", detail = "follow symlinks" }
no_index = { type = "bool", flag = "--no-index", detail = "force the pure live walk (skip index acceleration)" }
engine = { type = "linear|auto|pcre2", flag = "--engine/-P", detail = "linear matcher, automatic PCRE2 escalation, or explicit PCRE2 JIT" }
multiline = { type = "bool", flag = "-U", detail = "allow a match to span line boundaries" }
multiline_dotall = { type = "bool", flag = "--multiline-dotall", detail = "make `.` match newlines; implies multiline in the package" }
unicode = { type = "bool|null", flag = "--unicode/--no-unicode", detail = "explicit Unicode/ASCII semantics across the selected linear or PCRE2 backend; null keeps engine defaults" }

# What a Match record can be. `match` lines carry submatch spans; `context`
# lines are the -A/-B/-C neighborhood and carry none.
[match_kinds]
match = { detail = "a line containing at least one submatch" }
context = { detail = "a leading/trailing context line (no submatches)" }

# ripgrep's process exit codes — preserved end-to-end so a script reading the
# code means the same thing it does for rg.
[exit_codes]
matched = { code = 0, detail = "at least one match" }
no_match = { code = 1, detail = "ran cleanly, found nothing" }
error = { code = 2, detail = "unsupported pattern/flag, or an I/O/walk error — never a silent empty result" }

# ── irregex: the irregular-expression surface (native shapes, no rg parity) ──
# The set-shaped tier over the engine (src/search/): pattern SETS with exact
# per-pattern attribution (match), compression-kinship sketches (relate — LZ78
# dictionary bottom-k MinHash, LZJD distance — plus the winnowed structure
# silhouette), and a closed filter/group/sort/limit plan executed engine-side
# (weave). Surfaced as CLI verbs; like `--rank` these are gist vocabulary with
# no rg equivalent, so they carry no parity obligation — their contract is the
# semantics pinned here.
#
# Corpus policy: the verbs load the INDEX corpus (every non-binary file under
# the roots minus VCS/build subtrees), not the rg-parity gitignore walk. They
# are corpus analytics, not per-file greps. Results stream NDJSON under
# `--json`; diagnostics stay on stderr.
[irregex]
sketch = { k = 128, min_phrase = 3, algorithm = "LZ78 phrase dictionary -> bottom-k (KMV) of 64-bit phrase hashes; distance = 1 - KMV-estimated Jaccard (LZJD)", detail = "deterministic: same bytes => same sketch on every platform" }
silhouette = { k = 256, gram = 5, window = 4, algorithm = "normalize (identifiers->I, numbers->N, strings->S, comments dropped, pan-language keywords kept) -> hash every gram-token shingle -> winnow (min of every window) -> bottom-k (KMV); distance = 1 - KMV-estimated Jaccard", detail = "the STRUCTURE channel: a renamed Type-2 twin normalizes to the identical token stream, so its silhouette distance is exactly 0 while its byte distance stays far; deterministic, language-agnostic (a squint, not a parse)" }
attribution = { detail = "a PatternSet answer is bit-identical to N independent single-pattern runs; the fused (?:a)|(?:b) gate is an accelerator that may only skip work, never change an answer (tests hold it to the single-pattern oracle)" }

[irregex.verbs]
similar = { argv = "relate similar <path> [--lens bytes|structure|fused] [--top N] [--json] [--no-index] [ROOT...]", detail = "nearest files to <path> by compression kinship, ascending distance; --lens picks the channel — bytes (LZJD, default), structure (silhouette; renamed twins surface), or fused (min of both); the target itself is excluded; answers from the kinship atlas when one is fresh-foldable, live otherwise — identical answers (--no-index forces live)" }
dups = { argv = "relate dups [--max-distance T] [--top N] [--json] [--no-index] [ROOT...]", detail = "near-duplicate pairs across the corpus, closest first; candidates via shared bottom-16 seed hashes, every emitted pair exactly verified against both sketches; atlas-accelerated like similar" }
clusters = { argv = "relate clusters [--max-distance T] [--min-size N] [--top N] [--json] [--no-index] [ROOT...]", detail = "fork families — connected components of the verified dup graph, size-desc then exemplar-asc, members path-asc; exactly the transitive closure of dups at the same threshold" }
echoes = { argv = "relate echoes [--min-echo E] [--top N] [--json] [--no-index] [ROOT...]", detail = "DRY candidates dups cannot see: pairs with echo = byte_distance - structure_distance >= E (default 0.15), widest gap first — same skeleton under different vocabulary (Type-2 clones); silhouette seed buckets nominate, both channels verify exactly; deliberately rank-shaped: the echo is self-calibrated per pair, no absolute dup threshold exists across corpora" }
patterns = { argv = "relate patterns -e P [-e P...] [-f FILE] [-F] [-i] [--by pattern|file] [--under GLOB] [--top N] [--json] [ROOT...]", detail = "one walk, N patterns, exact per-pattern attribution as path:line rows; --by groups into counts, --under/--top shape engine-side (loom); rows are total-ordered (path, line, pattern) so output is deterministic" }
pack = { argv = "relate pack <text> [--top N] [--json] [ROOT...]", detail = "the SET of files that jointly describes <text> cheapest — greedy max-coverage over corpus-priced query chunks nominated by Gist's persisted trigram codebook; each pick's marginal_bits is exactly the priced bits it adds beyond earlier picks; foreign chunks are reported, never silently absorbed" }
search = { argv = "relate search <text> [--top N] [--json] [ROOT...]", detail = "which files would describe <text> most cheaply — Gist's mmap-backed trigram codebook nominates with corpus-priced query evidence, then a suffix-automaton Ziv-Merhav cross-parse over bounded query-bearing windows decides; score = 1 - cost/cold, higher = closer" }
quote = { argv = "relate quote <text> [--json]", detail = "rewrite <text> as maximal verbatim quotations from the WHOLE corpus, priced in bits (cross-parse on the persisted codex shelf, O(|text|)); each phrase attributed to one exemplar file; corpus-conditional bits/byte is the novelty meter" }

# relate owns its warm tier the way gist owns the trigram index (a full
# engine, not a shim): the kinship atlas persists one LZJD sketch + one
# structure silhouette per corpus file; queries fold in every file changed
# since the build anchor (same T3 stat walk, both channels refreshed
# together) and gate emitted rows against deletion. An accelerator, never an
# authority — a missing/corrupt atlas answers live with identical bytes.
[irregex.lifecycle]
atlas = { file = ".local/gist-verify/kinship.atlas", detail = "magic ATLS v3: anchor + NUL-separated path catalog + fixed-width sketch rows + fixed-width silhouette rows + FNV-1a checksum; broad kinship scopes use it, narrow explicit scopes sketch live when cheaper; fails closed on corruption" }
index = { argv = "relate index [--shelf]", detail = "build + persist the atlas atomically (anchor captured BEFORE the corpus read); --shelf also rebuilds the codex shelf quote reads — the same artifact `gist codex build` writes" }
status = { argv = "relate status [--json]", detail = "atlas + shelf readiness and staleness; exit 0 when the atlas is ready, 1 otherwise (verbs still answer, live)" }

# The agent / code-place tool boundary (ADR-352, plan step 5). Billy operating a
# user's machine and a coding agent working a repository are the same actor: both
# express "find these matches in this tree" as one SearchRequest. Billy's
# `fs_search(place, query, glob, context_lines, semantic, at)` verb
# (services/ai/tools/code/place/fs.py) speaks a slightly different vocabulary
# than the canonical request fields; `gist.request_from_tool` normalizes it.
#
# `aliases` map a tool-boundary parameter name onto its canonical request option.
[tool_boundary.aliases]
query = "pattern"         # fs_search's term for the pattern
glob = "globs"            # singular tool param -> the list option
context_lines = "context" # fs_search's symmetric-context param

# `routing_keys` are recognized-but-ignored by the request mapper: they select
# *where* the repository lives and *how* results are ranked, which is the place
# adapter's decision, not GIST's. Listing them here is the contract statement
# that one semantic API does not require one transport — place/transport routing
# stays outside GIST.
[tool_boundary.routing_keys]
place = "which place owns the tree (workspace | machine | scratch)"
at = "place addressing (e.g. 'home' or an absolute granted path)"
semantic = "rank by meaning via the place's vector index, not this engine"
