# irregex — the export surface.
#
# The outward half of the law. `charter.zone` says what a file inside this
# package may reach; nothing said what the package promises to everyone else,
# and that asymmetry is exactly how the public surface drifted: a bench needed
# one automaton stage, the shortest path was a new name at the root, and by the
# time anyone counted there were seventeen `regex_*` spellings shaped by the
# test harness rather than by a consumer.
#
# So this file is the promise, and `quality/surface/check.py` judges `src/root.zig`
# against it. A name exported without a row here fails; a row without an export
# fails. Adding a public name therefore costs one line of prose about who it is
# for — which is the cheapest possible moment to notice that nobody is.
#
# Three tiers, meaning three different promises:
#
#   stable       semver protects it. A breaking change to one of these is a
#                major version, and the name is documented in the README.
#   provisional  shipping and supported, but the shape is still being learned.
#                Depend on it; expect a minor version with a changelog entry to
#                move it, where moving a stable name would need a major.
#   internal     no promise at all. The product seam the sibling packages ride,
#                and the retired spellings, which are a semver obligation rather
#                than a courtesy — see [deprecation].
#
# `why` is not decoration. It is the question a reader arrives with, and if a
# row cannot answer one, the export is answering nobody.

[stable]

# ── the two vocabularies ──
mark = { why = "where a match landed and which pattern landed it — the types every other signature is written in" }
Span = { why = "a byte range [start, end) over one haystack" }
Match = { why = "one match: a span plus the pattern that produced it" }
PatternID = { why = "which pattern of a slate an answer is about" }
Window = { why = "what to search vs what to read while searching — so a bounded search does not move the edges every assertion resolves against" }
Authority = { why = "whether an answer decides or only nominates — the promise that an index may eliminate work and never overrule bytes" }
fault = { why = "the five fault domains, the declinature enum, and the thread-local detail slot a C host pulls" }

# ── the engine ──
regex = { why = "the whole engine behind one sealed door: syntax, ast, the automata road, captures, the match seam" }
Pattern = { why = "a compiled pattern and everything you ask of it — match, find, walk, capture, replace, split, with its own scratch so no signature says Sim" }
Munch = { why = "anchored longest-match over a slate: the lexer primitive, and the reason a tokenizer can be built on this package" }
Chorus = { why = "many patterns in one pass, answering which of them occur" }
scan = { why = "the byte tier: memmem, Teddy, Aho-Corasick, class runs, and the LiteralSet that dispatches across them" }
slate = { why = "many patterns in one walk with exact per-pattern attribution, and the plan that shapes the rows" }
math = { why = "the product-free floor: bits, globs, edit distance, union-find, sharding, leases, the hash-consed DAG, the crest calculus, the succinct structures, the balanced-parenthesis tree, the four semirings one shortest-path routine runs on, and the three collapse primitives — partition refinement, the minterm partition of a scalar line, and the DAFSA" }
codex = { why = "the FM-index over the succinct floors, and the persisted multi-doc shelf above it" }

# ── which bytes are eligible, and what is persisted about them ──
corpus = { why = "the walk and the corpus it materializes" }
scope = { why = "path eligibility: the committed charter, gitignore precedence, the filter, the type registry, the code/docs/data partition" }
index = { why = "the persisted artifacts, grouped by what each one eliminates" }
fresh = { why = "the freshness law: build anchor, change journal, sweep — why a days-old artifact still answers correctly" }

# ── surfaces ──
api = { why = "the hosted Zig API: Engine, SearchQuery, Cursor, CancelToken over the warm engine" }
ffi = { why = "the C-ABI substrate every package in the ecosystem returns, plus this one's three question planes over a buffer — one pattern, a slate, and the anchored longest-match a lexer runs on" }
assay = { why = "the instrumentation floor: typed spans, comptime-checked tallies, the one diagnostic channel" }
Brand = { why = "who the program riding this engine is — the name it signs a diagnostic with" }
Outcome = { why = "the rg 0/1/2 exit contract, both precedences" }
fatal = { why = "the catch that keeps an escaped error off Zig's default handler, which would exit 1 on a hard fault" }

# ── identity ──
version_string = { why = "the engine semver, lifted from build.zig.zon so a release bumps one line" }
pcre2_version_string = { why = "the vendored PCRE2 the -P backend links" }
abi = { why = "the C-ABI compatibility integer, so a bench binary linking the module reports what the library would" }

[provisional]

# Exported because the CLI's own module root sits outside this module's path and
# needs the same door — which is a fact about our build layout, not a promise
# anyone asked for. Its shape is whatever the engine happens to call today
# (handle-relative open, read, whole-file map, write, argv, stdin readiness), so
# it grows a member whenever the descent needs one. Semver-freezing a surface
# defined that way freezes an accident; a caller may absolutely depend on it,
# and should expect a minor version with a changelog entry to move it.
portal = { why = "the platform seam — the POSIX-shaped primitives, with the Windows fork stated once" }

engine = { why = "the transport-neutral compiled query and the certified walk-and-emit control plane both runtimes execute through" }
session = { why = "the resident core: what is held across queries, and the faces one answer can wear" }
emit = { why = "rg-shaped output and the --json record stream, for anyone building a grep rather than consuming one" }
argv = { why = "the flag grammar a face parses" }
preference = { why = "the machine-local, TTY-gated defaults file — structurally invisible to a pipe, and therefore to every agent" }
rank = { why = "weighted reciprocal-rank fusion over intrinsic byte signals" }
signals = { why = "the per-language declaration confidence and codegen demotion that fusion reads" }
haystack = { why = "the bytes of one file as the walk hands them on" }
bulkstat = { why = "the batched stat walk the freshness anchor is folded from" }

[internal]

inner = { why = "the product seam: what the faces built on this library reach that is not curated vocabulary. Versions with them, promises nothing to anyone else" }

# ── which planes a non-Zig host can reach ──
#
# The tier tables above say what the package hands a Zig caller. This says which
# of those a C caller can reach, and it exists because nothing said so.
#
# `contract/bindings.toml` is horizontal across the three bindings, and every
# gate under it starts from the ABI. So a plane that never got an `export fn` was
# invisible to all of them: correct in Zig, absent from the header, and reported
# by nobody. That is how the corpus planes sat finished and unreachable for as
# long as they did — the exact-search face minted its own cursor shim because
# the ABI published a regex matcher and called itself a search toolkit.
#
# One row per stable and provisional export, in exactly one of the two tables.
# `[door]` names ONE symbol `include/irgx.h` must declare — the cheapest proof
# that the plane has a way in, not an inventory of its verbs, which the header
# and the parity gate already hold. `[door.none]` is the decision that it has
# none, and it needs a reason for the same purpose a waiver does.
#
# `[internal]` is exempt and may not be listed. It promises nothing to anyone,
# so "can C reach it" is not a question anyone is owed an answer to.
[door]

# ── the two vocabularies ──
mark = "irgx_match"
Span = "irgx_span"
Match = "irgx_match"
PatternID = "irgx_slate_which"
Window = "irgx_pattern_windows"
Authority = "irgx_sieve_candidates"
fault = "irgx_last_fault"

# ── the engine ──
regex = "irgx_compile"
Pattern = "irgx_is_match"
Munch = "irgx_munch_scan"
Chorus = "irgx_slate_which"
scan = "irgx_needles_compile"
slate = "irgx_slate_compile"
codex = "irgx_codex_build"

# ── which bytes are eligible, and what is persisted about them ──
corpus = "irgx_walk_open"
scope = "irgx_walk_genus"
index = "irgx_sieve_open"
fresh = "irgx_sieve_freshness"

# ── surfaces and identity ──
api = "irgx_engine_open"
ffi = "irgx_abi_version"
engine = "irgx_tree_search"
version_string = "irgx_version"
pcre2_version_string = "irgx_pcre2_version"
abi = "irgx_abi_version"

# ── the planes a C host cannot reach, and why not ──
#
# Two species. One is the product: a shape an executable chooses, where an ABI
# verb would be publishing our taste as somebody else's contract. The other is
# the floor: a Zig-comptime surface with no C shape at all.
[door.none]

math = { why = "the floor is generic over comptime types — the semirings, the hash-consed DAG, the succinct structures. Only the pieces a search verb needs cross the ABI, and they cross inside the verb: glob and type matching as `irgx_walk_term`, the crest calculus as the plan `irgx_sieve_describe` reports" }
assay = { why = "typed spans and comptime-checked tallies over the host's own channel. A C host has its own instrumentation, and the one thing it needs from ours is the per-incident detail, which `irgx_last_fault` hands over" }
Brand = { why = "who the program riding the engine is. A library cannot know, and a host that signs a diagnostic already has its own name for itself" }
Outcome = { why = "the rg 0/1/2 exit contract, which belongs to whoever calls `exit`. The ABI's own answer is a status per call, and a host maps that onto whatever its ecosystem expects" }
fatal = { why = "a Zig `catch` that keeps an escaped error off the default panic handler. The C promise is stronger and already kept: every shim returns a status instead of aborting, so there is nothing here left to hand out" }
portal = { why = "the platform seam the descent is written against — handle-relative open, whole-file map, argv, stdin readiness. A C host has libc, which is where these came from" }
session = { why = "the resident core, and the one plane deliberately owned elsewhere: the pull cursor and the run entry are the exact-search face's library, with its own header and its own symbol prefix" }
emit = { why = "rg-shaped rows and the --json record stream. Byte-for-byte output compatibility is a promise about a command line, so it belongs to the binary that has one; the ABI hands structured records and lets a host render them" }
argv = { why = "the flag grammar a face parses. An ABI that took argv would be a second command line with no terminal behind it" }
preference = { why = "the machine-local, TTY-gated defaults file. It is structurally invisible to a pipe on purpose, and a linked library is always the pipe case" }
rank = { why = "weighted reciprocal-rank fusion. The weights are a product's editorial judgment about what a definition is worth against a call site, and freezing ours into the ABI would publish that judgment as a contract. A host reads the same intrinsic signals off the rows it already gets" }
signals = { why = "the per-language declaration confidence and codegen demotion that fusion reads. It has no consumer without a ranker, and the ranker above is the product's" }
haystack = { why = "one file's bytes as the walk hands them on. The ABI reports paths, spans and lines; a C host that wants the bytes has `read`, and handing out our buffer would put an arena's lifetime in a caller's hands for nothing" }
bulkstat = { why = "the batched stat walk the freshness anchor folds from. What a caller needs is the verdict, not the walk, and `irgx_sieve_freshness` is the verdict" }

# ── what the last release exported and this tree does not ──
#
# A breaking change, declared. The tier tables above say what the surface IS;
# this says how it CHANGED, which is the question semver actually asks and the
# one a tier table structurally cannot answer. `quality/surface/check.py` diffs
# the newest release tag's `root.zig` against this tree and fails on a removal
# that is not written down here — the arm exists because this pass dropped
# nineteen names and the only thing that noticed was a downstream bench failing
# to compile, one name per build.
#
# It is keyed on declaration rather than on the version number because
# release-please owns that number: the working tree stays at the last released
# version until the release PR moves it, so a gate demanding the major bump
# first would be red for the whole development window by construction. Naming
# the removal is something a change can do on the day it happens.
#
# The block ends by itself. Once the major ships, the newest tag no longer
# exports these either, so every row goes stale and the gate says to delete them.
#
# Nothing here was load-bearing for a consumer: only four had a caller anywhere
# in the ecosystem (`verify`, `captures`, `emit_json`, `matcher` — all in the
# exact-search face's bench harness, which is the surface this pass was about),
# and those moved in the same change.
[removed]

# Empty, and that is the block working. 2.0.0 shipped the thirty-three removals
# this table declared, so the newest tag no longer exports them either and every
# row went stale by the mechanism the header describes. The migration notes they
# carried (`regex_dfa` → `regex.dfa`, and the rest) belong to that release's
# changelog now, which is where someone upgrading across the major reads them;
# carrying them here as well would be a second copy that only the gate reads.
#
# The next break writes its rows here, on the day it happens.
