# The Setup table in CONTRIBUTING.md, made executable:
#
#     mise install
#
# The language pins below are mirrors. In order they track
# `minimum_zig_version` in build.zig.zon, `channel` in
# bindings/rust/rust-toolchain.toml, the `toolchain` directive in bindings/go/go.mod,
# and the `--python` CI hands uv. Bump one and bump its source file in the
# same commit; otherwise the two drift and CI is the only thing that notices.
#
# 2026.4.0 made lockfile_platforms stable; 2026.10.0 preserves the Python
# artifact already selected in a platform lock instead of silently choosing a
# fresh rebuild. Older mise can discard the bytes this lock was meant to pin.
min_version = "2026.10.0"

[tools]
zig = "0.16.0"
go = "1.27.1"
python = "3.12.15"
"github:astral-sh/uv" = "0.12.22"

# This row is a table rather than a bare "1.99.0" for one word: llvm-tools.
# rustup ships LLVM's binutils inside the toolchain - llvm-objdump, llvm-nm,
# llvm-strip, llvm-objcopy, llvm-cov, plus opt/llc/llvm-dis - built from the
# same LLVM the compiler links, so pinning rustc pins them too (23.1.1 here).
# That is 166 MB of binutils against 1.7 GB for a full Homebrew LLVM, which
# floats free of any pin; mise's only other route is an asdf plugin that
# builds LLVM from source with cmake.
#
# They are load-bearing, not a nicety. The vendoring scripts under
# bindings/*/scripts/ shell llvm-nm to ask an archive for its symbols and
# llvm-strip to drop DWARF out of ELF, which Apple's strip cannot do at all.
# Proving which ISA a shipped archive really contains needs llvm-objdump, and
# neither Apple's /usr/bin/objdump nor `zig objdump` (which has no -d) covers
# that. rustup keeps them in the sysroot instead of on PATH; find_tool() in
# those scripts asks rustc where. By hand:
#
#     "$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
rust = { version = "1.99.0", components = [ "llvm-tools" ] }

# The discipline gate's binaries, mirroring what CI resolves so a local run and
# a red X mean the same thing. markdownlint-cli2 and typos are the versions the
# pinned actions bundle; golangci-lint is the `version:` its action is handed.
# Bump one and bump the workflow in the same commit.
#
# The three binary rows lock a checksum per release platform; the npm row
# freezes its transitive graph in a native aube sidecar, with registry
# integrity hashes. Commit the sidecars beside mise.lock.
"npm:markdownlint-cli2" = "0.23.1"
# The npm tool's native shim executes Node. Its interpreter is part of the
# locked contributor and push-hook closure, rather than a machine-global shim.
node = "26.10.0"
typos = "1.50.3"
golangci-lint = "2.14.0"
# CI uses the runner's preinstalled shellcheck, so this pin is about presence
# rather than exactness: a shell gate a contributor cannot run locally is a
# gate they meet for the first time in review.
shellcheck = "0.11.0"
# zoning - the import-topology gate the `topology` job runs. `charter.zone` is
# the only file in this repo that a compiler never reads, so the whole point of
# pinning it here is that you can ask it what it thinks WHILE you edit the
# contract - `zoning map`, `zoning status`, `--suggest` - instead of meeting its
# verdict in review. The workflow installs the same version with `uv run
# --with`; bump the two in the same commit. Like the npm row, a `pipx:` pin
# freezes its native uv dependency graph and wheel hashes in a sidecar.
# The wheel carries the static binary and has no runtime dependencies.
"pipx:zoning" = "1.4.0"

# Deliberately absent: ruff, yamllint, taplo, editorconfig-checker, zizmor.
# CI installs each with `uv run --no-project --with <pkg>==<version>`, and
# CONTRIBUTING tells you to type the same line - so the workflow already IS the
# version authority. A second pin here could only disagree with it.

[settings]
# Apply the same two-day floor to native tool dependency resolution.
minimum_release_age = "2d"
# mise.lock is committed, so a contributor and CI resolve the same bytes.
# mise.local.toml and mise.local.lock stay gitignored for machine overrides.
lockfile = true
lockfile_platforms = [ "macos-arm64", "macos-x64", "linux-x64", "linux-arm64" ]

# Both are defaults today. Pinned anyway, because this repo ships prebuilt
# binary archives and a stray global config turning provenance checks off
# should not be possible without editing this file.
slsa = true
github_attestations = true

# A bare `mise use <tool>` writes the exact resolved version, never a range.
pin = true
