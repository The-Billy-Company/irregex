# typos checks authored source and prose. Upstream bytes, generated archives,
# and standards tables are evidence, not copy for this repository to rewrite.

[files]
extend-exclude = [
  "*.a",
  "*.baseline",
  "*.lock",
  "*.tsv",
  "go.sum",
  "vendor/",
  "bindings/rust/vendor/",
  "tools/ucd/",
  "tools/whatwg/",
  # The UCD name table, front-coded: the same excluded standards text as
  # tools/ucd/, with every shared prefix elided. So a name's tail begins
  # mid-word by construction, and the fragments left behind ("OT" from FOOT,
  # "RELA" from a Cyrillic name) are artifacts of the encoding rather than
  # words anything here chose to spell.
  "src/kernel/regex/unicode/names.gen.zig",
]

[default]
locale = "en-us"
extend-ignore-re = [
  "(?Rm)^.*(#|//|--)\\s*spellchecker:disable-line$",
  "(#|//|--)\\s*spellchecker:ignore-next-line\\n.*",
  "(?s)(#|//|--)\\s*spellchecker:off.*?\\n\\s*(#|//|--)\\s*spellchecker:on",
]
extend-ignore-identifiers-re = [ "^[A-Za-z0-9]{20,}$" ]

[default.extend-words]
