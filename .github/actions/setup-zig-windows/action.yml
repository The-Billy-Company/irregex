# Zig on a Windows runner, pinned and checksummed, for both Windows jobs.
#
# Deliberately not `mlugg/setup-zig`, and deliberately always the x64 build:
# Zig 0.16's arm64 Windows compiler emits malformed LLVM records for bundled C
# sources, and the engine is bundled C sources. The x64 compiler runs fine
# under Windows' x64 emulation on an arm64 machine and cross-compiles to
# whatever `-Dtarget` asks for, so one download serves both arches and neither
# one meets the broken compiler.
#
# It installs but does not put Zig on PATH. Writing an environment file from
# inside a composite action hands whatever called it a step that can extend
# PATH for the rest of the job, which is worth an audit finding whatever the
# action happens to write today. The caller adds `into` - a literal it chose -
# to its own PATH, which is a static write in a workflow that knows its own
# trigger.
name: Set up Zig on Windows
description: Install a pinned, checksum-verified Zig into a directory the caller names.

inputs:
  version:
    description: Zig version, which must equal build.zig.zon's minimum_zig_version.
    required: true
  into:
    description: Directory to install into. The caller adds this to PATH itself.
    required: true

runs:
  using: composite
  steps:
    - name: Provision Zig
      shell: pwsh
      env:
        ZIG_VERSION: ${{ inputs.version }}
        ZIG_INTO: ${{ inputs.into }}
      run: |
        $ver = $env:ZIG_VERSION
        $floor = Select-String -Path build.zig.zon -Pattern '\.minimum_zig_version = "([^"]+)"'
        if (-not $floor) { throw 'no minimum_zig_version in build.zig.zon' }
        $declared = $floor.Matches[0].Groups[1].Value
        if ($declared -ne $ver) { throw "workflow pins zig $ver, build.zig.zon declares $declared" }

        $target = 'x86_64-windows'
        $index = Invoke-RestMethod -Uri 'https://ziglang.org/download/index.json'
        $release = $index.$ver
        if (-not $release) { throw "ziglang.org carries no $ver release" }
        $build = $release.$target
        if (-not $build) { throw "zig $ver has no $target build" }

        $zip = Join-Path $env:RUNNER_TEMP 'zig.zip'
        Invoke-WebRequest -Uri $build.tarball -OutFile $zip
        $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower()
        if ($got -ne $build.shasum) { throw "sha256 mismatch: got $got, expected $($build.shasum)" }

        # Unpacked beside the destination and then renamed onto it, because the
        # archive's own top-level directory carries the version and the caller
        # named a path that does not.
        $staging = Join-Path $env:RUNNER_TEMP 'zig-unpack'
        New-Item -ItemType Directory -Force -Path $staging | Out-Null
        tar.exe -xf $zip -C $staging
        if ($LASTEXITCODE -ne 0) { throw "tar could not extract the Zig archive" }
        $root = (Get-ChildItem -Directory -LiteralPath $staging | Select-Object -First 1).FullName
        if (-not $root) { throw "the archive extracted no directory into $staging" }

        $into = $env:ZIG_INTO
        if (Test-Path -LiteralPath $into) { Remove-Item -Recurse -Force -LiteralPath $into }
        New-Item -ItemType Directory -Force -Path (Split-Path -Parent $into) | Out-Null
        Move-Item -LiteralPath $root -Destination $into
        if ((& (Join-Path $into 'zig.exe') version) -ne $ver) { throw 'provisioned Zig reports the wrong version' }
