# Cross-compilation protects the Windows arms from source drift; only a native
# kernel can prove the library loads, executes, and crosses the ctypes ABI.
name: windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  native:
    name: native (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      ZIG_TARGET: ${{ matrix.zig_arch }}-windows
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            zig_arch: x86_64
            runner: windows-2025
          - arch: arm64
            zig_arch: aarch64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Provision Zig
        shell: pwsh
        run: |
          $ver = $env:ZIG_VERSION
          $floor = Select-String -Path build.zig.zon -Pattern '\.minimum_zig_version = "([^"]+)"'
          if (-not $floor) { throw 'no minimum_zig_version in build.zig.zon' }
          $declared = $floor.Matches[0].Groups[1].Value
          if ($declared -ne $ver) { throw "workflow pins zig $ver, build.zig.zon declares $declared" }

          # Zig 0.16's arm64 compiler emits malformed LLVM records for bundled
          # C sources. The x64 compiler runs under Windows emulation and emits
          # the native matrix target requested by the build below.
          $target = 'x86_64-windows'
          $index = Invoke-RestMethod -Uri 'https://ziglang.org/download/index.json'
          $release = $index.$ver
          if (-not $release) { throw "ziglang.org carries no $ver release" }
          $build = $release.$target
          if (-not $build) { throw "zig $ver has no $target build" }

          $zip = Join-Path $env:RUNNER_TEMP 'zig.zip'
          Invoke-WebRequest -Uri $build.tarball -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower()
          if ($got -ne $build.shasum) { throw "sha256 mismatch: got $got, expected $($build.shasum)" }

          $into = Join-Path $env:RUNNER_TEMP 'zig'
          New-Item -ItemType Directory -Force -Path $into | Out-Null
          tar.exe -xf $zip -C $into
          if ($LASTEXITCODE -ne 0) { throw "tar could not extract the Zig archive" }
          $root = (Get-ChildItem -Directory -LiteralPath $into | Select-Object -First 1).FullName
          if (-not $root) { throw "the archive extracted no directory into $into" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $root
          if ((& (Join-Path $root 'zig.exe') version) -ne $ver) { throw 'provisioned Zig reports the wrong version' }

      - name: Test and build shipped library
        run: |
          zig build test -Dtarget=$env:ZIG_TARGET -j1
          zig build -Dtarget=$env:ZIG_TARGET -Doptimize=ReleaseFast -j1

      - name: Python ABI smoke
        shell: pwsh
        run: |
          $library = Get-ChildItem -Path zig-out -Filter 'irgx.dll' -Recurse | Select-Object -First 1
          if (-not $library) { throw 'zig build produced no irgx.dll' }
          $env:IRGX_LIB = $library.FullName
          $env:PYTHONPATH = (Resolve-Path 'bindings/python').Path

          python -c "import irgx; m = irgx.search(r'(?P<key>\w+)=(?P<value>\d+)', 'x=42'); assert m and m.group('key') == 'x' and m.group('value') == '42'"
          if ($LASTEXITCODE -ne 0) { throw "Python ABI smoke exited $LASTEXITCODE" }

  required:
    name: native
    if: always()
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test '${{ needs.native.result }}' = success
