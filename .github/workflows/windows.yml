# Cross-compilation protects the Windows arms from source drift; only a native
# kernel can prove the library loads, executes, and crosses the ctypes ABI.
#
# Two jobs, because they defend different claims. `native` builds the engine
# here and proves the sources still compile and pass for this platform.
# `bindings` proves the other half: that the archive each binding ships links
# and runs under the toolchain a Windows consumer actually has.
#
# The unit suite runs on ONE of the two arches, and which one is a coverage
# argument rather than a budget one. Running it twice on Windows buys the
# intersection of two things already held elsewhere: `check-windows` is folded
# into every `zig build test`, so the library's Sema and codegen for
# `aarch64-windows` are gated on Ubuntu, macOS and Windows x64 alike, and
# `macos-latest` is itself AArch64 running the whole suite. What only a Windows
# ARM kernel can answer is whether an `aarch64-windows` artifact links, loads
# and crosses an ABI there — which is what the ReleaseFast build and the ctypes
# smoke below settle, and what `bindings (arm64)` settles again from source
# through MSVC with the Go and Rust suites on top. So x64 runs the suite, arm64
# compiles every test source for its triple without running it, and neither
# claim goes unmade. Executing the suite on both spent 30-60 minutes a push to
# re-derive one of them, and paid for it in fixture races no other lane sees:
# a write's directory entry is flushed lazily on Windows, so a fixture that
# writes a file and immediately asks the walk about it is asserting a
# scheduling property of that volume, not a promise of ours.
name: windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  native:
    name: native (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      ZIG_TARGET: ${{ matrix.zig_arch }}-windows
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            zig_arch: x86_64
            runner: windows-2025
            suite: true
          - arch: arm64
            zig_arch: aarch64
            runner: windows-11-arm
            suite: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig-windows
        with:
          version: ${{ env.ZIG_VERSION }}
          into: ${{ runner.temp }}\zig
      - name: Put Zig on PATH
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\zig"

      - name: Unit suite
        if: ${{ matrix.suite }}
        run: zig build test "-Dtarget=$($env:ZIG_TARGET)" -j1

      # Compile every test source for this triple and run none of them. Sema and
      # codegen over test-only code are the one thing `check-windows` does not
      # reach — it is rooted at the C-ABI export surface — so this keeps a test
      # that only an ARM Windows build would reject from rotting, at a Debug
      # compile's price rather than a ReleaseSafe suite's.
      - name: Compile the suite for this triple
        if: ${{ !matrix.suite }}
        run: zig build check "-Dtarget=$($env:ZIG_TARGET)" -j1

      - name: Build shipped library
        run: zig build "-Dtarget=$($env:ZIG_TARGET)" -Doptimize=ReleaseFast -j1

      - name: Python ABI smoke
        shell: pwsh
        run: |
          $library = Get-ChildItem -Path zig-out -Filter 'irgx.dll' -Recurse | Select-Object -First 1
          if (-not $library) { throw 'zig build produced no irgx.dll' }
          $env:IRGX_LIB = $library.FullName
          $env:PYTHONPATH = (Resolve-Path 'bindings/python').Path

          python -c "import irgx; m = irgx.search(r'(?P<key>\w+)=(?P<value>\d+)', 'x=42'); assert m and m.group('key') == 'x' and m.group('value') == '42'"
          if ($LASTEXITCODE -ne 0) { throw "Python ABI smoke exited $LASTEXITCODE" }

  # The Go module and the Rust crate each carry a prebuilt archive per platform
  # so a consumer needs no Zig, and every other check on those archives is made
  # from a machine that cannot run one. This job is where that stops being an
  # assumption.
  #
  # It is also the only place `-lntdll` is really tested. The engine reaches the
  # kernel through 60 `Nt*`/`Zw*`/`Rtl*`/`Ldr*` symbols; mingw-w64's default
  # library set stops at kernel32, and Zig's own driver adds ntdll silently - so
  # every link performed off Windows closes for a reason a consumer's link would
  # not have. Beyond those 60, the archives import nothing but kernel32 and the
  # dozen-odd C functions (`malloc`, `memcpy`, the ctype table) that msvcrt and
  # UCRT both export, which is why either mingw flavour links them.
  #
  # Which Rust target each arch runs is decided by what the runner can link, and
  # between them they cover both rungs of build.rs:
  #
  #   x64   -> `x86_64-pc-windows-gnu`, linked by the image's mingw-w64 gcc.
  #            Exercises the *vendored archive* rung the way a consumer does.
  #   arm64 -> `aarch64-pc-windows-msvc`, the host target and the one nearly
  #            every Windows arm64 Rust user is on. No archive is vendored for
  #            any MSVC target and none can be, so this exercises the *source*
  #            rung: build.rs shells Zig against the installed Visual Studio.
  #
  # That leaves `aarch64-pc-windows-gnullvm` linked by nobody here, because
  # llvm-mingw is not on the image and Zig cannot stand in for it - Zig's mingw
  # is UCRT-only and Rust's GNU targets ask the linker for `msvcrt`. Its archive
  # is not untested, though: it is the same engine build, for the same Zig
  # triple, that the Go arm64 step below links and runs on this kernel.
  bindings:
    name: bindings (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-gnu
          - arch: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 needs it as cgo's C compiler, because mingw-w64's gcc was never
      # ported there. x64 needs it because the MSVC rung builds the engine from
      # source, and on that arch the vendored rung is covered by gcc instead.
      - uses: ./.github/actions/setup-zig-windows
        with:
          version: ${{ env.ZIG_VERSION }}
          into: ${{ runner.temp }}\zig
      - name: Put Zig on PATH
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\zig"

      # Named as a hard failure rather than a fallback. An arch that quietly
      # stopped using the toolchain it was chosen for would keep passing while
      # it stopped testing the thing it exists for.
      - name: Settle the C toolchain
        shell: pwsh
        run: |
          if ('${{ matrix.arch }}' -eq 'x64') {
            $gcc = Get-Command gcc -ErrorAction SilentlyContinue
            if (-not $gcc) { throw 'no gcc on PATH; this arch exists to link the way mingw does' }
            & gcc --version | Select-Object -First 1

            # rustc synthesises import libraries for `raw-dylib` crates by
            # shelling the target-prefixed dlltool, and does not fall back to
            # the bare name. Binutils ships both spellings in some mingw
            # distributions and only one in others, so bridge it here rather
            # than discovering it in a linker error three steps later.
            $prefixed = Get-Command x86_64-w64-mingw32-dlltool -ErrorAction SilentlyContinue
            if (-not $prefixed) {
              $bare = Get-Command dlltool -ErrorAction SilentlyContinue
              if (-not $bare) { throw 'mingw is on PATH without dlltool; rustc cannot bind raw-dylib crates' }
              Copy-Item -LiteralPath $bare.Source `
                -Destination (Join-Path (Split-Path $bare.Source) 'x86_64-w64-mingw32-dlltool.exe')
            }
          } else {
            Add-Content -LiteralPath $env:GITHUB_ENV `
              -Value 'CC=zig cc -target aarch64-windows.win10_rs4-gnu'
          }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bindings/go/go.mod

      - name: Go binding
        working-directory: bindings/go
        env:
          CGO_ENABLED: "1"
        run: |
          go vet ./...
          go test ./...

      - name: Rust binding
        working-directory: bindings/rust
        run: |
          rustup target add ${{ matrix.rust_target }}
          cargo test --target ${{ matrix.rust_target }}

  required:
    name: native
    # A newer push deliberately cancels this run. Preserve the aggregate for
    # real matrix failures, but do not turn an obsolete cancellation into a
    # second, misleading failed check.
    if: ${{ !cancelled() }}
    needs: [native, bindings]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test '${{ needs.native.result }}' = success
          test '${{ needs.bindings.result }}' = success
