# Open (and keep updating) a release PR from the conventional commits on main.
#
# The PR bumps `build.zig.zon` and every packaging manifest that mirrors it —
# the list lives in release-please-config.json, and each target line carries an
# `x-release-please-version` marker. Merging it tags `vX.Y.Z` and cuts a GitHub
# Release. Nothing here publishes: `release.yml` does that, triggered by the tag.
#
# ── Three things worth knowing before the first release
#
# 1. towncrier, not release-please, owns CHANGELOG.md — the curated fragments
#    under changelog.d/ are the notes people actually read, so the config sets
#    `skip-changelog`. The `fold changelog` job below folds them into
#    CHANGELOG.md at the exact version this PR bumps to and pushes that onto
#    the PR branch; it re-runs on every push to main while the PR stays open,
#    so the fold never falls behind whatever fragments are on the branch when
#    someone finally merges. `release.yml`'s preflight re-checks the fold
#    landed before it will publish anything.
#
# 2. The bot moves the number in every manifest that carries the marker, and it
#    cannot move the number inside build output. The vendored engine archives,
#    the oracle corpora, and the lockfiles all embed this package's version and
#    none of them is a line anybody types, so a bumped PR leaves twelve
#    archives, two corpora, and two lockfiles describing the release before it.
#    `mint artifacts` below regenerates exactly those and pushes them onto the
#    same branch, which is what makes the PR's own CI a real verdict. v2.1.0
#    shipped only because all of it was minted by hand after the fact.
#
# 3. This runs as a GitHub App, not as Actions, and it has to. Two independent
#    walls make the default GITHUB_TOKEN useless here: the enterprise forbids the
#    Actions identity from creating pull requests at all, and a tag GITHUB_TOKEN
#    pushes does not start another workflow (GitHub's recursive-CI guard), so
#    `release.yml` would never fire and the wheels would need publishing by hand.
#    An installation token is a different actor and clears both. The App is
#    `billy-company-release`; its identifier is the org variable
#    RELEASE_APP_CLIENT_ID and its signing key the org secret
#    RELEASE_APP_PRIVATE_KEY, shared by every repo in the ecosystem so there is
#    one thing to rotate. The installation is scoped to this ecosystem's repos,
#    so a token minted here cannot reach the private monorepo.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a half-applied release PR is worse than a slow one.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Deliberately no write here. Every write below is made with the App's
      # installation token, which carries its own contents/pull-requests/issues
      # grants; leaving GITHUB_TOKEN read-only keeps the Actions identity out of
      # the release path entirely rather than granting it rights it cannot use.
      contents: read
    outputs:
      # The branch of the open release PR, whether or not THIS run touched it.
      # The action's own `pr` output is set only when it wrote something, so a
      # push that leaves an existing PR alone — a `ci:` commit, or a new
      # changelog fragment, neither of which changes the version — reported no
      # PR at all and skipped both jobs below. The PR then sits open with
      # fragments unfolded and artifacts unminted, and nothing says so until
      # preflight refuses to publish it.
      head: ${{ steps.target.outputs.head }}
    steps:
      # Exchange the App's signing key for an installation token scoped to this
      # repo, valid one hour. Fails loudly if the App is not installed here.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id, not app-id: the action deprecated the numeric id.
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrow the token to the three grants release-please actually uses. A
          # minted token otherwise inherits everything the installation holds, so
          # without this a permission added to the App later would silently widen
          # every release run.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # release-please reads the commit history through the GitHub API, so there
      # is nothing to check out and nothing to build.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          token: ${{ steps.app-token.outputs.token }}

      # Asked of the repository's state rather than of what this run happened to
      # do. `autorelease: pending` is release-please's own marker for the PR it is
      # holding open — the same label its next run reads to decide whether a
      # release is outstanding — so this is its bookkeeping, not a branch name
      # guessed from a naming convention.
      - id: target
        name: Which branch the open release PR is on
        env:
          PR: ${{ steps.release.outputs.pr }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          head=$(python3 -c 'import json, os; print(json.loads(os.environ["PR"] or "{}").get("headBranchName", ""))')
          if [ -z "$head" ]; then
            head=$(gh pr list --repo "$REPO" --state open --label 'autorelease: pending' \
                     --json headRefName --jq '.[0].headRefName // ""')
          fi
          echo "head=${head}" >> "$GITHUB_OUTPUT"
          echo "release PR branch: ${head:-<none open>}"

  # Folds changelog.d/ into CHANGELOG.md on the release PR's own branch, at the
  # version `build.zig.zon` declares there — read back through the shared
  # `version` command rather than re-parsed here, so this job agrees with the
  # preflight by construction instead of by two authors keeping two regexes in
  # sync. It runs for as long as the PR is open, not only on the push that
  # created it: a fragment can land days later, and folding it then is the whole
  # point of the job.
  fold-changelog:
    name: fold changelog
    needs: release-please
    if: needs.release-please.outputs.head != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ needs.release-please.outputs.head }}
          persist-credentials: false

      - id: version
        uses: The-Billy-Company/.github/actions/package-release@deb135f046122a10cabc861e96eb9941c2d09ddc # main
        with:
          command: version
          args: --root .

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Fold changelog.d fragments into CHANGELOG.md at this PR's version
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' \
            <<<"${STEPS_VERSION_OUTPUTS_RESULT}")
          uv run --no-project --python 3.12 --with towncrier==25.8.0 \
            towncrier build --yes --version "$version"
          # towncrier closes the new section with a blank line, and the blank
          # line this file keeps under the marker rides down with the heading it
          # used to precede — so the seam against the previous release lands with
          # two of them, which MD012 rejects and every release so far has deleted
          # by hand. Squeeze that one pair rather than vendoring a fork of
          # towncrier's template: the rendering stays upstream's, and the rest of
          # the file, fenced blocks included, is untouched.
          python3 -c 'import pathlib, re; p = pathlib.Path("CHANGELOG.md"); p.write_text(re.sub(r"\n{3}(?=## \[)", "\n\n", p.read_text(), count=1))'
          # Against HEAD, not the index: towncrier stages its own work — it
          # adds the newsfile and retires each fragment with `git rm` — so a
          # bare `git diff` compares a tree that already matches the index and
          # reports a correct fold as nothing to do.
          if git diff --quiet HEAD -- CHANGELOG.md changelog.d; then
            echo "nothing new to fold at $version"
            exit 0
          fi
          git config user.name 'billy-company-release[bot]'
          git config user.email 'billy-company-release[bot]@users.noreply.github.com'
          git add CHANGELOG.md changelog.d
          git commit -m "chore(changelog): fold fragments for v$version"
          # The checkout above declined to persist its credential (so this
          # workspace can never leak the App token through an artifact upload
          # nobody here performs), so the one write this job makes carries its
          # own auth rather than relying on git's credential store.
          git push "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:${HEAD_BRANCH}"
        env:
          STEPS_VERSION_OUTPUTS_RESULT: ${{ steps.version.outputs.result }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ needs.release-please.outputs.head }}

  # Regenerates the committed artifacts that carry the version in their bytes
  # rather than on a line: the vendored engine archives, the oracle corpora, and
  # the lockfiles. `tools/mint_artifacts.py` owns which those are and how each is
  # refreshed — discovered from `contract/bindings.toml` and from what lies
  # beside each artifact — so this job stays a shim over a tool a maintainer can
  # run locally, and a fourth binding is covered without editing any YAML.
  #
  # After `fold-changelog`, not beside it: both push to the release PR's branch,
  # and two jobs racing the same ref means one of them loses to a non-fast-forward
  # and the PR is left half-updated.
  mint-artifacts:
    name: mint artifacts
    needs: [release-please, fold-changelog]
    if: needs.release-please.outputs.head != ''
    runs-on: ubuntu-latest
    # Twelve cross-compiled archives plus two corpora; a minute or two in
    # practice, and a ceiling well under the six-hour default so a hung
    # toolchain download fails the PR instead of holding a runner all day.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ needs.release-please.outputs.head }}
          persist-credentials: false

      # The whole job hangs off this answer, and the answer is cheap: reading
      # twelve archives and four TOML files takes under half a second, where
      # installing a toolchain to rebuild what is already current would take
      # minutes on every push to main while the PR stays open. Exit 1 is "stale",
      # and anything else is a fault in the tool itself — never a quiet skip.
      - id: guard
        name: Is anything committed still describing the previous version?
        run: |
          set +e
          python3 tools/mint_artifacts.py --check
          code=$?
          set -e
          case $code in
            0) echo "stale=0" >> "$GITHUB_OUTPUT" ;;
            1) echo "stale=1" >> "$GITHUB_OUTPUT" ;;
            *) exit $code ;;
          esac

      # Read back through the shared command rather than re-parsed here, so the
      # commit message names the same version the fold and the preflight do.
      - id: version
        if: steps.guard.outputs.stale == '1'
        uses: The-Billy-Company/.github/actions/package-release@deb135f046122a10cabc861e96eb9941c2d09ddc # main
        with:
          command: version
          args: --root .

      # A cache is writable by any workflow on any branch, which is a fine trade
      # in CI and the wrong one here: these archives are committed, vendored into
      # the crate and the Go module, and shipped to whoever installs them. Same
      # reasoning as release.yml's wheel build, and the same pinned version.
      - if: steps.guard.outputs.stale == '1'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - if: steps.guard.outputs.stale == '1'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      # Both vendoring scripts refuse to ship an archive they could not strip:
      # the DWARF nothing links against dominates the committed size, and going
      # ahead without it would quietly triple what a `cargo add` downloads. They
      # look for `llvm-strip` in the Rust toolchain's sysroot first, and the
      # runner's toolchain is installed without it. Which LLVM strips is not
      # load-bearing — the archive is Zig's output, and rustup is simply where a
      # matched `llvm-strip` and `llvm-nm` are one command away. At the
      # repository root, deliberately: this is the directory the scripts ask for
      # a sysroot from, so the component lands on the toolchain they will resolve.
      - if: steps.guard.outputs.stale == '1'
        name: The strip the vendoring scripts require
        run: rustup component add llvm-tools

      # The corpora are generated by asking the Python binding for spans, and it
      # reaches the engine through the library `zig build` installs. The archives
      # are cross-compiled by their own scripts; this build is what the reference
      # binding loads on this host.
      - if: steps.guard.outputs.stale == '1'
        name: Build the engine the corpora are generated against
        run: zig build

      - if: steps.guard.outputs.stale == '1'
        name: Re-mint whatever the bump left behind, and commit it
        run: |
          set -euo pipefail
          # Refreshes only the stale artifacts, and re-reads every one of them
          # afterwards: a rebuild that succeeds and emits the same stale bytes is
          # the one failure a mint cannot self-report.
          python3 tools/mint_artifacts.py
          # Porcelain rather than `git diff`: a target added since the last
          # release mints an archive that no commit has ever held, and a tracked
          # -only comparison would call that "nothing changed".
          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::the mint reported work and changed nothing — refusing" \
                 "to leave the PR looking refreshed when it is not." >&2
            exit 1
          fi
          git config user.name 'billy-company-release[bot]'
          git config user.email 'billy-company-release[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore(release): re-mint committed artifacts at v$VERSION"
          # The checkout above declined to persist its credential, so this write
          # carries its own auth rather than relying on git's credential store.
          git push "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:${HEAD_BRANCH}"
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ needs.release-please.outputs.head }}
          VERSION: ${{ fromJson(steps.version.outputs.result).version }}
