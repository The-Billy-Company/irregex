# What has to be true before a change lands.
#
# Four faces plus three discipline gates, seven jobs, deliberately not one: a
# Zig engine regression and a Rust clippy nit are different news, and a single
# job would report them as the same red X.
#
# The engine builds from its own clone with nothing beside it, and that is
# itself something CI proves every run — this is the base of the ecosystem's
# dependency graph and it must not need the things that depend on it. The
# bindings are the exception, and only just: they mirror four contract TOMLs and
# two of those are authored next door. `kinship.toml` is the kinship package's
# and is vendored here, because that package is internal and a public package the
# public cannot test is not really public. `surface.toml` is the exact-search
# face's, and that face is public, so those jobs check it out and read the
# original rather than keeping a copy that can go stale.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push mid-run should cancel the run it obsoleted, not race it - but only
# on a branch whose runs are drafts. On `main` every commit is a candidate to be
# released, and `release.yml` refuses to publish a tag unless `release-ready`
# concluded success on that exact commit. Cancelling here made the next push to
# main revoke the previous commit's verdict: one job ends `cancelled`,
# `release-ready` runs `if: always()` and reads that as a failure, and preflight
# declines a release that nothing was actually wrong with. So main's runs never
# cancel each other and each commit keeps its own answer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  engine:
    # Both host families, because the build branches on them: macOS re-archives
    # through `libtool` for ld64's alignment rules, and the resident tier's Unix
    # sockets behave differently enough to be worth exercising on each.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Compile-only first: when this fails, the test log below is noise, and
      # the failure is one line rather than a suite's worth of scrollback.
      - run: zig build check
      - run: zig build test
      # The header this package installs, read as the standards it claims to
      # speak rather than as whatever cgo's default forgives. Two objects, both
      # thrown away, on both operating systems.
      - name: header parses as C99 and C++17
        run: zig build header

  hermetic:
    # The same suite, run by an operator whose environment disagrees with it.
    #
    # A fixture that builds a tree under /tmp and then queries it is making a
    # claim about a corpus it never declared: the skip overlay resolves from
    # `<PREFIX>_SKIP`, the tree's charter, and `<PREFIX>_DIR/skips.list`, so an
    # ambient value naming `src` prunes the fixture's own directory and the
    # engine correctly declines a root it was told to ignore. That shape once
    # accounted for fourteen tests at once, every one of them green on a clean
    # box and red on a configured one, which is the worst way to hold a suite:
    # it passes here and fails on the only machine that matters, someone's.
    #
    # One host is enough — the defect is reading the environment, not the
    # platform — but it cannot share the engine job's cache, because Zig keys
    # the cache on the environment and that is precisely what moves here. That
    # is the cost, and it buys a suite that states its own inputs.
    runs-on: ubuntu-latest
    env:
      # Deliberately hostile: the directory names a real checkout is most
      # likely to contain, so a fixture that leans on any of them is caught.
      HOSTILE_SKIPS: >-
        src lib test tests spec docs doc bench benches vendor third_party
        tool tools script scripts example examples fixture fixtures
        internal pkg build dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: suite under a hostile GIST_SKIP
        run: GIST_SKIP="${HOSTILE_SKIPS}" zig build test
      - name: suite under a hostile skips.list
        # The third leak vector into the same overlay, and the one that reaches
        # the engine without any variable naming a skip — so it has to be
        # exercised separately rather than assumed equivalent to the line above.
        run: |
          d="$(mktemp -d)"
          tr ' ' '\n' <<<"${HOSTILE_SKIPS}" > "$d/skips.list"
          GIST_DIR="$d" zig build test

  python:
    # 3.12 is the declared floor and is load-bearing (PEP 695 syntax in the
    # runtime), so it is tested rather than assumed. There is no upper pin: a
    # published library has no business refusing next year's interpreter, and
    # the way to keep that true is to notice when it breaks.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      # ── this job checks out one repository, and that is the point ──
      #
      # Everything the suite reads, this repository publishes: its own
      # `include/irgx.h` for the cffi mirror gate, its own `analytic.toml` and
      # `engine.toml`, and the kinship package's `kinship.toml` vendored into
      # `contract/` by `tools/sync_contract.py` and drift-gated from that
      # package's own CI.
      #
      # It used to clone all four packages, because the mirror declared every
      # face's symbols and the gate needed every face's header to check them.
      # Those declarations now live with the libraries that export them — each
      # face's own `*_run` entry, in its own header and its own native module —
      # so each package gates
      # its own surface in its own CI. A substrate whose tests need its
      # consumers checked out is a substrate its consumers cannot be released
      # without, and this is a public repository that anyone should be able to
      # clone alone and get a verdict from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Without this the suite reports green over the seam that matters most.
      # The FFI tier resolves `libirgx` out of this checkout's zig-out/, and a
      # miss there is a silent darkening rather than an error — the loader
      # returns nothing and the tier's tests simply stop existing, which is what
      # the skip check below is here to catch.
      - name: Build the library the suite drives
        run: zig build --summary none
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # The binding ships two transports and a source checkout has one, so
      # without this the suite proves the ctypes half and reports green over the
      # C extension every published wheel for this platform actually contains.
      # It is also what keeps the skip gate below honest: the parity tests need
      # both implementations resident, and where there is no accelerator they
      # would go dark rather than fail.
      - name: Build the accelerator the wheels ship
        working-directory: bindings/python
        run: uv run --python ${{ matrix.python }} python scripts/build_accel.py
      # Twice, because "the fallback still works" is a claim about a path no
      # ordinary run takes any more. The second pass deselects the parity tests
      # rather than skipping them — there is genuinely only one transport there,
      # and a question deliberately not asked must not look like a tier that
      # went dark. Everything else, including the whole FFI surface, runs on
      # both.
      - name: pytest on both transports, and prove nothing skipped itself
        working-directory: bindings/python
        run: |
          set -o pipefail
          run() {
            echo "::group::pytest $*"
            uv run --python ${{ matrix.python }} pytest -q -rs "$@" 2>&1 | tee "$RUNNER_TEMP/pytest.log"
            echo "::endgroup::"
            if grep -qE '^SKIPPED|[0-9]+ skipped' "$RUNNER_TEMP/pytest.log"; then
              echo "::error::a test skipped itself — a library or binary did not resolve"
              exit 1
            fi
          }
          run
          export IRGX_NO_ACCEL=1
          run -m "not accel"

  go:
    # No Zig and no sibling, for two separate reasons that happen to agree.
    #
    # The module carries a prebuilt archive per supported platform precisely so
    # `go get` needs no toolchain, and this job deliberately does not rebuild it
    # — the committed archive is the rung a consumer actually links. The default
    # build does not even reach it: the cgo path is behind `irgx_ffi`, so a plain
    # `go test` exercises the pure-Go ladder.
    #
    # And the ladder's tests no longer drive a producer. They pin this package's
    # own reasoning — tier introspection, the FFI escape hatch, seam refusals,
    # cancellation, the digest policy — none of which spawns a child. The two
    # that did moved to the repositories that build one: the row-and-stats
    # comparison to the exact-search face's `exact`, the kinship oracle to the
    # kinship package's bindings. This repository builds no binary, so asking for
    # one here was asking for a consumer's, which is a public suite the public
    # cannot run.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bindings/go/go.mod
      - run: go vet ./...
      - run: go test ./...
      # `go vet` judges correctness; this judges the rest of what the binding
      # promises a consumer — an unchecked Close, a swallowed error, a shadowed
      # return. It runs here rather than beside the other linters because the
      # toolchain it needs is already standing up in this job.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: bindings/go

  rust:
    # Same reasoning as Go: `vendor/<triple>/libirgx.a` is what a normal
    # `cargo build` links, so that is the rung CI should be exercising.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/rust
    steps:
      # One checkout, like the python job: every contract the parity gate reads
      # is committed here, the exact-search face's `surface.toml` having gone
      # back to that package along with the constants that mirrored it. No Zig
      # and no ecosystem build either — the archive cargo links is committed to
      # this repository, which is the rung a consumer actually takes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # override the pin the repository already made.
      - run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # A prebuilt binary rather than the Docker action, which takes a
      # repo-root-relative manifest path and would have to be told about a
      # layout that differs in every one of these repositories. This is a
      # plain step, so it inherits the working directory and the toolchain
      # rustup already resolved above.
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-deny@0.19.0
      # deny.toml has been checked in the whole time with nothing running it.
      # `check` is all four: a RustSec advisory against anything in the graph,
      # the banned crates that would mean this binding grew a TLS stack or an
      # async runtime, the license allowlist, and the registries a crate may
      # come from.
      - run: cargo deny check

  fmt:
    # Its own job, for the same reason the other five are: formatter drift is
    # its own kind of news, and it is the kind most easily misread as something
    # else. `zig fmt` pads a column-aligned multiline literal into a grid, so a
    # rename that shrinks the widest cell leaves every row beneath it one space
    # too wide — in files nobody touched. That wants a red X that says so.
    #
    # Folding it into `engine` would run it twice for a verdict that cannot
    # differ by host, and bury it under a build log. Folding it into `ratchets`
    # would put a Zig toolchain into the one job that deliberately has none.
    # This is seconds either way; the toolchain install is what setup-zig
    # caches, and a job that reports for itself is worth that.
    #
    # Pinned to the ZIG_VERSION the engine builds with, because the formatter's
    # output is a property of the compiler release — checking against a
    # different Zig would be checking against a different grid.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: zig fmt --check
        run: |
          set -euo pipefail
          # Enumerated rather than spelled out as a path list, because a path
          # list drifts the same silent way the formatting did. The invocation
          # that caught this by hand named `tools`, which holds no Zig at all,
          # and would have missed a new top-level directory that did.
          #
          # Tracked plus untracked-not-ignored is every Zig file this repository
          # owns. What that leaves out is exactly the ignored trees — cargo's
          # `bindings/rust/target`, which parks a whole semver-checks copy of
          # this repo, and `zig-pkg/` — so the exclusions are named in
          # `.gitignore` and reviewable there, rather than being whatever
          # happened to fall outside an argument list.
          #
          # The existence test is for a working tree mid-edit, where the index
          # can still name a file someone has deleted; CI's checkout never has
          # one, and a stale index should not read as a formatting failure.
          files=()
          while IFS= read -r f; do
            if [ -f "$f" ]; then files+=("$f"); fi
          done < <(git ls-files -co --exclude-standard '*.zig')
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::found no .zig files — the enumeration is broken, not the tree" >&2
            exit 1
          fi
          echo "checking ${#files[@]} files"
          zig fmt --check "${files[@]}"

  discipline:
    # The engine can compile perfectly while the surface a stranger arrives at
    # rots: a dead link in the README, a fence with no language, a manifest that
    # stopped parsing, a workflow that trusts a movable tag. That is one kind of
    # news — the public explanation no longer matches the thing — so it gets one
    # red X, separate from the six jobs that judge the code.
    #
    # It is also the only job here that needs neither Zig nor a build. A
    # contributor who mistyped a heading should learn that in seconds, not after
    # a matrix compiles. Every tool here is a Python distribution installed into
    # uv's isolated environment at a pinned version, so this job's verdict moves
    # when we move it and not when a formatter ships a release. ShellCheck used to
    # be the exception and shipped with the runner, until an image carrying an
    # older build reported SC2317 against a `trap`-invoked cleanup that newer
    # ShellCheck reads correctly — a red X nobody here caused.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Markdown structure and layout
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
      - name: Authored spelling
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0
      - name: YAML structure
        run: uv run --no-project --with yamllint==1.38.0 yamllint .
      - name: TOML format and schemas
        run: |
          uv run --no-project --with taplo==0.9.3 taplo fmt --check
          uv run --no-project --with taplo==0.9.3 taplo lint
      - name: EditorConfig conformance
        run: uv run --no-project --with editorconfig-checker==3.8.0 ec
      - name: Python lint and format
        run: |
          uv run --no-project --with ruff==0.16.1 ruff check --config quality/ruff.toml .
          uv run --no-project --with ruff==0.16.1 ruff format --check --config quality/ruff.toml .
      - name: Shell correctness
        run: git ls-files -z '*.sh' | xargs -0 uv run --no-project --with shellcheck-py==0.11.0.1 shellcheck
      # Last, so it audits the exact file CI just interpreted — including every
      # action and permission this job itself introduced.
      - name: GitHub Actions security
        run: uv run --no-project --with zizmor==1.29.0 zizmor --no-online-audits --strict-collection .

  ratchets:
    # Five baseline-guarded lints over src/**/*.zig — see quality/ratchets/ —
    # plus the export gate, which asks the same kind of question about the same
    # tree: does the front door still hand out what contract/exports.toml says.
    # They are text scans, so there is no Zig step: compiling the engine to
    # count `std.debug.print` call sites would tie a grep to a toolchain it
    # does not use, and would make this the slowest job instead of the fastest.
    #
    # Stdlib-only Python by design, so uv is here to pin an interpreter rather
    # than to install anything; `uv run --no-project` keeps it from discovering
    # bindings/python's pyproject and building a wheel this job has no use for.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # fix is in the code — never in the baseline.
      - run: uv run --no-project --python 3.12 python quality/ratchets/run.py
      # The detectors' own unit tests. A ratchet that stopped detecting reports
      # a clean tree, which is the one failure mode the gate cannot self-report,
      # so the proofs run beside it rather than on a slower cadence.
      - name: ratchet detector tests
        run: |
          for t in quality/ratchets/*/test_*.py; do
            uv run --no-project --python 3.12 python "$t"
          done
      # The zone contract's other half: it governs what a file inside may
      # reach, this governs what the package hands out. A row is the fix — never deleting
      # one to go green while the export is still there.
      - name: export surface
        run: uv run --no-project --python 3.12 python quality/surface/check.py
      - name: export gate proofs
        run: uv run --no-project --python 3.12 python quality/surface/test_check.py
      # The horizontal half. Every gate above judges one artifact against one
      # contract; this is the only one that compares the bindings to each other,
      # which is how three independently-correct bindings drifted to different
      # ABI coverage. A [waived] row with a reason is the fix for a deliberate
      # omission - never deleting a binding's row to go green.
      - name: binding parity
        run: uv run --no-project --python 3.12 python quality/parity/check.py
      - name: binding parity proofs
        run: uv run --no-project --python 3.12 python quality/parity/test_check.py

  topology:
    # `charter.zone` declares this package's import topology - the zone
    # stack, the sealed deep modules, the guest lists, the reach ceiling, the
    # cycle ban - and until this job existed, nothing read it. Zig has no
    # visibility rules between files inside a package and its analysis is lazy
    # enough that a genuine import cycle still compiles, so every boundary the
    # READMEs describe was convention with nothing standing behind it. A
    # declaration nobody enforces is a comment.
    #
    # Pinned like every other tool in this file, and installed the same way, so
    # this job's verdict moves when we move it. No Zig and no build: zoning reads
    # the tree, not a build graph, so it is one of the fastest jobs here.
    name: topology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # The fix is in the code, or in a `variance ... because "..."` that says
      # what would retire it - never in quietly widening the contract to match
      # what the imports happen to do today.
      #
      # `--complete` adds the claim no law can make: every package here carries a
      # contract. A green run over the packages that opted in says nothing about
      # the one somebody adds next week, and coverage nobody checks decays.
      - name: Import topology
        run: uv run --no-project --with zoning==1.3.1 zoning verify --complete

  version:
    # One number lives in `build.zig.zon`; the manifests that cannot import it —
    # the contract, Cargo, PyPI, the Go mirror — carry a marked copy the release
    # bot rewrites. This asks whether those copies still agree, and whether the
    # bot has been told about every one of them. A mirror the config forgot is
    # the interesting failure: nothing breaks until a release ships a package
    # claiming last version's number.
    #
    # Stdlib-only, no Zig and no build — it reads lines.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv run --no-project --python 3.12 python tools/version_parity.py

      # Every index this project publishes to shows the repository README as the
      # project's page, and each one resolves a relative link against its own
      # URL rather than against GitHub. `registry_readme.py` corrects that at
      # package time; this proves, on every commit, that it still can — a link
      # to a file somebody moved fails here rather than at the release, or worse,
      # as a well-formed URL on a published page pointing at nothing.
      - run: uv run --no-project --python 3.12 python tools/registry_readme.py --check

  changelog:
    # Nothing was checking the news fragments, and the failure mode is quiet by
    # construction: `towncrier build --draft` will cheerfully render a clean
    # changelog while silently dropping any file whose name it does not
    # recognize. A fragment typed `.fixd.md` instead of `.fixed.md` is not an
    # error to towncrier — it is simply not a fragment, so it renders nothing,
    # exits 0, and stays invisible until someone notices the entry missing from a
    # release. With 195 fragments queued here, that is a lot of surface for one
    # typo to hide in.
    #
    # So `--draft` on its own is NOT the gate, and adding it alone would have
    # been a green tick over exactly the defect it was supposed to catch. The
    # strictness comes from `ignore` in `towncrier.toml`: setting that key flips
    # towncrier from skipping unparseable filenames to failing on them, with a
    # message naming the file. That puts the fragment grammar in towncrier's
    # hands rather than in a bespoke filename parser here — the same reason
    # `fmt` above takes its file set from `git ls-files` instead of a path list.
    # There is no second spelling to keep in sync, and a contributor running
    # `towncrier build --draft` locally now gets the same error CI does.
    #
    # `towncrier check` is deliberately not what this runs: that verb asks
    # whether a branch ADDED a fragment, which is a contribution policy. This
    # job only asks whether the fragments that exist are well-formed.
    #
    # No Zig and no build, like `ratchets` — this reads filenames.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: every fragment is one towncrier recognizes
        run: |
          set -euo pipefail
          # The version is a placeholder — `--draft` writes nothing, and the
          # number only shows up in the heading it renders to stdout.
          draft=$(uv run --no-project --with towncrier towncrier build --draft --version 0.0.0)
          printf '%s\n' "$draft"
          # The vacuous-green guard, in the same spirit as `fmt`'s "found no .zig
          # files". A misconfigured `directory`, or a fragment directory towncrier
          # cannot read, renders "No significant changes." and exits 0 — a
          # passing gate over nothing. Conditioning on fragments actually being
          # present on disk keeps this honest right after a release, when an empty
          # `changelog.d` and an empty draft are the correct answer. `README.md`
          # is the one non-fragment `.md` in there, and it is named in the
          # `ignore` list for that reason.
          fragments=$(find changelog.d -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "changelog.d holds ${fragments} fragment(s)"
          if [ "$fragments" -gt 0 ] && printf '%s' "$draft" | grep -q 'No significant changes'; then
            echo "::error::${fragments} fragments on disk but towncrier rendered none — the wiring is broken, not the tree" >&2
            exit 1
          fi

  release-ready:
    # The one check `release.yml`'s preflight polls for on the exact tagged
    # commit (`release.toml`'s `[ci].required_check`). Everything above feeds
    # into it, so a red job blocks the tag rather than the publish workflow
    # discovering it three minutes into a wheel build. `if: always()` is
    # required — the default `if` on a job would skip this one the moment
    # anything upstream failed, which is exactly the case it has to report on.
    if: always()
    needs:
      [engine, hermetic, python, go, rust, fmt, discipline, ratchets, topology, version, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: every required job is green
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 -c "
          import json, os
          needs = json.loads(os.environ['NEEDS'])
          failed = sorted(name for name, info in needs.items() if info['result'] != 'success')
          if failed:
              raise SystemExit(f'not release-ready: {failed} did not succeed')
          print(f'release-ready: {len(needs)} required jobs all succeeded')
          "
