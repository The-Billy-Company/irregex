# ─────────────────────────── mode: -P PCRE2 ─────────────────────────────────

[[shape]]
id = "pcre-lookahead-rare-files"
pattern = 'WalletService(?=[\s\S]*ctx)'
gist = [ "-P", "-l" ]
rg = [ "-P", "-l" ]
bar = "set"
expect = "win"
dims = { mode = "pcre", flags = "lookahead", scope = "rootless", emit = "files", select = "rare", kind = "lookaround" }

[[shape]]
id = "pcre-lookahead-common-files"
pattern = 'func \w+\((?=.*ctx)'
gist = [ "-P", "-l" ]
rg = [ "-P", "-l" ]
bar = "set"
expect = "win"
dims = { mode = "pcre", flags = "lookahead", scope = "rootless", emit = "files", select = "common", kind = "lookaround" }

# A pure backreference with NO extractable required literal — once a declared
# structural loss (nothing for the trigram index to anchor on, so both engines
# scanned the corpus with PCRE2 and split ~11 s of catastrophic backtracking on
# one 3.6 MB base64 fixture). The PCRE2 shadow gate (`pcre2/shadow.zig`) turned
# it: `\1` splices to a copy of its group's source, giving an assertion-free
# linear over-approximation whose O(1)/byte DFA rejects every line PCRE2 would
# have backtracked through — PCRE2 only confirms candidates. rg still pays the
# full backtracking bill.
[[shape]]
id = "pcre-backref-files"
pattern = '(\w{4,})\s+\1'
gist = [ "-P", "-l" ]
rg = [ "-P", "-l" ]
bar = "set"
expect = "win"
dims = { mode = "pcre", flags = "backref", scope = "rootless", emit = "files", select = "common", kind = "backreference" }

# ─────────────────────────── mode: -U multiline ─────────────────────────────

# Once a declared loss (the -U emit ran on the serial engine, forfeiting the
# parallel walk). Now: `-U` rides the parallel per-file pipeline, and an
# assertion-free multiline pattern determinizes exactly (nothing positional to
# resolve), so `bufMatch` answers from the byte-class DFA at O(1)/byte instead
# of a Pike re-seed per position. Parity still gates it (byte-identical sets).
[[shape]]
id = "multiline-rare-files"
pattern = 'WalletService[\s\S]{0,80}?\{'
gist = [ "-U", "-l" ]
rg = [ "-U", "-l" ]
bar = "set"
expect = "win"
dims = { mode = "multiline", flags = "plain", scope = "rootless", emit = "files", select = "rare", kind = "cross-line" }

# The COMMON lazy-dotstar cross-line span — once the table's deepest declared
# loss (0.36x: serial -U emit + Pike whole-buffer scan vs rg's lazy DFA). The
# parallel -U pipeline plus the assertion-free multiline DFA (with the `-l`
# first-kept-span fast path in `Emitter.buffer`) turned it; kept as its own row
# so any regression in the -U emit model surfaces here first.
[[shape]]
id = "multiline-common-lazy-dotstar-files"
pattern = 'import \([\s\S]*?\)'
gist = [ "-U", "-l" ]
rg = [ "-U", "-l" ]
bar = "set"
expect = "win"
dims = { mode = "multiline", flags = "lazy-dotstar", scope = "rootless", emit = "files", select = "common", kind = "cross-line" }
