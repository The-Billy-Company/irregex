# Its own workspace root, deliberately. The crate has to lift out of this
# repository as a standalone package, and an empty `[workspace]` table means a
# Cargo.toml appearing above it later cannot silently absorb it and take over
# its lockfile and lint configuration.
[workspace]

[package]
# `irgx`, not `irregex`: the latter is an unrelated 2023 crate on the index and
# crate names are permanent, so it was never available to us. That is a happy
# accident — `irgx` is already the C symbol prefix, the header, and the Python
# import, so the Rust name now agrees with every other surface instead of being
# the one place the project is spelled out in full.
name = "irgx"
version = "1.0.0"                                                                                                                                                      # x-release-please-version
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Linear-time regex engine for Rust - no catastrophic backtracking, no ReDoS - plus the shared analytic substrate (row protocol, transports, contracts)."
# The crates.io landing page is the repository's own README, not the short one
# beside these sources - crates.io shows a README as the whole project page, and
# a visitor who lands there has nowhere else to look. Cargo has no metadata hook,
# so `tools/registry_readme.py` mints a link-corrected copy here and this points
# at it. Regenerate immediately before `cargo package`, never earlier: a missing
# file fails loudly and a stale one would ship quietly, so absent is the safe
# state to leave it in. The file is gitignored, and `cargo build` never reads it.
readme = "PROJECT_README.md"
homepage = "https://github.com/The-Billy-Company/irregex"
repository = "https://github.com/The-Billy-Company/irregex"
documentation = "https://github.com/The-Billy-Company/irregex/blob/main/bindings/rust/README.md"
authors = [ "The Billy Company" ]
# crates.io allows five, so each one has to earn its slot against the others.
# `pattern` and `bindings` were doing no work - `pattern` is a word every crate
# in this category uses, and `bindings` is what the category field already
# says. `redos` replaces them because it is the term somebody types when they
# have the problem this engine is the answer to, and almost nothing on
# crates.io claims it.
keywords = [ "regex", "regexp", "regex-engine", "redos", "automata" ]
categories = [
  "text-processing",
  "parsing",
  "algorithms",
  "api-bindings",
  "external-ffi-bindings",
]
# The vendored archives are the install story, so they ship. `target/` and the
# per-target build caches do not.
exclude = [ "/target", "/.cargo" ]

# No `[lib] name` override: the package is `irgx`, so the library Cargo derives
# is already `irgx` and callers already type `use irgx::…`. It used to be here
# only because the package was spelled `irregex`.

[dependencies]
# The substrate's subprocess tier speaks ripgrep `--json` and analytic NDJSON;
# serde is the idiomatic parser. The regex face itself needs no runtime deps.
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"

[dev-dependencies]
# The cross-check corpus against the reference Python binding is committed JSON,
# so the test suite needs no Python at test time - just a parser for it.
# The contract parity gate reads the canonical TOML files.
toml = "1"
# Behavioral tests plant a throwaway corpus.
tempfile = "3"

[lints.rust]
missing_docs = "deny"
# Every `unsafe` operation states its own invariant; an `unsafe fn` body is not
# a blanket permission slip for the operations inside it.
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# The rule that every `unsafe` block carries a `// SAFETY:` comment, enforced by
# the compiler instead of by review. The regex face holds this; the analytic
# substrate (moved from gist) is allow-listed at the module boundary until its
# blocks grow comments in a dedicated pass.
undocumented_unsafe_blocks = "deny"
