# The wheel bundles a native shared library, so it is platform-tagged, not
# `py3-none-any`. `hatch_build.py` builds the library, force-includes it under
# `irgx/lib/`, and sets the tag; see that file for the cross-build knobs.
#
# Zero runtime dependencies: the transport is ctypes, which is in the standard
# library, so installing needs no compiler and no Python headers.
#
# The 3.12 floor is load-bearing, not caution: the runtime uses PEP 695 generic
# syntax (`def mixin[C: type]`) and PEP 695 `type` aliases, which are parse
# errors before 3.12. Lowering it makes the metadata admit interpreters that
# cannot import the package.

[build-system]
requires = [ "hatchling>=1.31.0" ]
build-backend = "hatchling.build"

[project]
name = "irregex"
version = "1.0.0"                                                                                                                          # x-release-please-version
description = "Linear-time regex engine for Python - no catastrophic backtracking, no ReDoS, with the native engine bundled in the wheel."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = [ "LICENSE", "NOTICE" ]
authors = [ { name = "The Billy Company" } ]
# PyPI search scores name + summary + description + keywords, so these are the
# words somebody types when they have the problem this engine solves, not a
# restatement of the module name. Three families: what it is (regex engine,
# automata), what it guarantees (linear time, no backtracking, ReDoS), and what
# it is reached for instead of (re, re2, pcre2, hyperscan).
keywords = [
  "regex",
  "regexp",
  "regular-expression",
  "regex-engine",
  "re",
  "re2",
  "pcre",
  "pcre2",
  "hyperscan",
  "linear-time",
  "redos",
  "backtracking",
  "catastrophic-backtracking",
  "dfa",
  "nfa",
  "automata",
  "finite-automata",
  "thompson-nfa",
  "pike-vm",
  "pattern-matching",
  "text-processing",
  "search",
  "string-matching",
  "unicode",
  "simd",
  "fm-index",
  "trigram",
  "ffi",
  "zig",
]
dependencies = [  ]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Zig",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing",
  "Topic :: Text Processing :: General",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Utilities",
  "Typing :: Typed",
]

# PyPI renders these as the sidebar link list. Every one is a distinct
# destination: a reader who wants the changelog should not have to guess that
# it lives behind "Homepage".
[project.urls]
Homepage = "https://github.com/The-Billy-Company/irregex"
Documentation = "https://github.com/The-Billy-Company/irregex#readme"
Repository = "https://github.com/The-Billy-Company/irregex"
Issues = "https://github.com/The-Billy-Company/irregex/issues"
Changelog = "https://github.com/The-Billy-Company/irregex/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = [ "irgx" ]
# The library is placed by the hook rather than read out of the source tree, so
# a stale copy from a previous target can never be picked up by accident.
artifacts = [ "irgx/lib/*" ]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [ "irgx", "tests", "scripts", "hatch_build.py", "README.md", "LICENSE", "NOTICE" ]

[dependency-groups]
# `cffi` is test-only and stays out of `dependencies`: the regex API is ctypes
# over the stdlib, and the substrate's in-process tier fails open without it.
# It is here so the suites that assert the two transports agree actually run.
dev = [ "pytest>=8.0", "cffi>=1.17" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B", "SIM" ]
ignore = [ "E501" ]

[tool.ruff.lint.isort]
known-first-party = [ "irgx" ]
