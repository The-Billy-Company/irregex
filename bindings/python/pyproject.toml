# The wheel bundles a native shared library, so it is platform-tagged, not
# `py3-none-any`. `hatch_build.py` builds the library, force-includes it under
# `irgx/lib/`, and sets the tag; see that file for the cross-build knobs.
#
# Zero runtime dependencies: the transport is ctypes, which is in the standard
# library, so installing needs no compiler and no Python headers.
#
# The 3.12 floor is load-bearing, not caution: the runtime uses PEP 695 generic
# syntax (`def mixin[C: type]`) and PEP 695 `type` aliases, which are parse
# errors before 3.12. Lowering it makes the metadata admit interpreters that
# cannot import the package.

[build-system]
requires = [ "hatchling>=1.27" ]
build-backend = "hatchling.build"

[project]
name = "irregex"
version = "2.2.1"                                                                                                                          # x-release-please-version
description = "Linear-time regex engine for Python - no catastrophic backtracking, no ReDoS, with the native engine bundled in the wheel."
# The long description is the repository's own README, lifted and link-corrected
# at build time by `hatch_readme.py`. PyPI opens onto the project's front door,
# not onto a second one kept beside this file.
dynamic = [ "readme" ]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = [ "LICENSE", "NOTICE" ]
authors = [ { name = "The Billy Company" } ]
# PyPI search scores name + summary + description + keywords, so these are the
# words somebody types when they have the problem this engine solves, not a
# restatement of the module name. Three families: what it is (regex engine,
# automata), what it guarantees (linear time, no backtracking, ReDoS), and what
# it is reached for instead of (re, re2, pcre2, hyperscan).
keywords = [
  "regex",
  "regexp",
  "regular-expression",
  "regex-engine",
  "re",
  "re2",
  "pcre",
  "pcre2",
  "hyperscan",
  "linear-time",
  "redos",
  "backtracking",
  "catastrophic-backtracking",
  "dfa",
  "nfa",
  "automata",
  "finite-automata",
  "thompson-nfa",
  "pike-vm",
  "pattern-matching",
  "text-processing",
  "search",
  "string-matching",
  "unicode",
  "simd",
  "fm-index",
  "trigram",
  "ffi",
  "zig",
]
dependencies = [  ]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Zig",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing",
  "Topic :: Text Processing :: General",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Utilities",
  "Typing :: Typed",
]

# PyPI renders these as the sidebar link list. Every one is a distinct
# destination: a reader who wants the changelog should not have to guess that
# it lives behind "Homepage".
[project.urls]
Homepage = "https://github.com/The-Billy-Company/irregex"
Documentation = "https://github.com/The-Billy-Company/irregex#readme"
Repository = "https://github.com/The-Billy-Company/irregex"
Issues = "https://github.com/The-Billy-Company/irregex/issues"
Changelog = "https://github.com/The-Billy-Company/irregex/blob/main/CHANGELOG.md"

[tool.hatch.metadata.hooks.custom]
path = "hatch_readme.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_readme.py"

[tool.hatch.build.targets.wheel]
packages = [ "irgx" ]
# The library is placed by the hook rather than read out of the source tree, so
# a stale copy from a previous target can never be picked up by accident.
artifacts = [ "irgx/lib/*" ]
# The accelerator is placed the same way, and this is what makes that true. A
# developer who ran `scripts/build_accel.py` has one sitting in the tree; without
# this line it would be swept into every wheel, including the portable one whose
# whole promise is that it has no compiled extension in it. The hook's own build
# arrives by `force_include`, which outranks this.
exclude = [ "irgx/_accel*" ]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "irgx",
  "accel",
  "tests",
  "scripts",
  "hatch_build.py",
  "hatch_readme.py",
  "README.md",
  "LICENSE",
  "NOTICE",
]

[dependency-groups]
# `cffi` is test-only and stays out of `dependencies`: the regex API is ctypes
# over the stdlib, and the substrate's in-process tier fails open without it.
# It is here so the suites that assert the two transports agree actually run.
# `hatchling` is here for the same reason at one remove: it is the build backend,
# and `test_description.py` drives the metadata hook that decides what PyPI shows.
dev = [ "pytest>=8.0", "cffi>=1.17", "hatchling>=1.27" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
# `--strict-markers` so `-m "not accel"` cannot quietly select nothing because
# somebody typed the name wrong. The mark itself means "needs both transports
# resident at once", which is only true where an accelerator was compiled; the
# ctypes-only CI pass deselects it rather than letting it skip, since this
# suite's gate treats any skip as a tier that went dark.
addopts = "--strict-markers"
markers = [ "accel: requires the native accelerator alongside ctypes" ]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B", "SIM" ]
ignore = [ "E501" ]

[tool.ruff.lint.isort]
known-first-party = [ "irgx" ]
