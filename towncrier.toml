# Towncrier configuration for gist — DO NOT hand-edit.
#
# Generated from the canonical template in the chronicle changelog driver
# (pkg/tools/support/chronicle/config.py). The package roster lives in
# pkg/tools/support/chronicle/packages.py.
#
#   make changelog-init             (re)materialize this file + changelog.d/
#   make changelog-verify           drift gate (byte-parity vs this template)
#   make changelog-create PKG=gist TYPE=added SLUG=my-change
#   make changelog-build  PKG=gist VERSION=x.y.z
#
# News fragments live in changelog.d/<issue>.<type>.md and are assembled into
# CHANGELOG.md at the `<!-- towncrier release notes start -->` marker on build.

[tool.towncrier]
name = "gist"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
wrap = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
