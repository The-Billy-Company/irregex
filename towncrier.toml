# Towncrier configuration for irregex.
#
# Inherited from the monorepo's changelog driver at extraction; standalone now —
# the file is hand-maintained here.
#
# News fragments live in changelog.d/<slug>.<type>.md and are assembled into
# CHANGELOG.md at the `<!-- towncrier release notes start -->` marker:
#
#   towncrier build --version x.y.z

[tool.towncrier]
name = "irregex"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
# Fragments here are multi-paragraph Markdown, not one-line notes. Towncrier's
# wrapper reflows each entry as a single flat block, which breaks fenced code,
# turns a hanging `-` into a setext heading, and splits inline code spans across
# lines. Off, the fragment's own layout is preserved and only indented.
wrap = false
# Not a cosmetic whitelist — this key is what makes a malformed fragment an
# error. Without it, towncrier silently ignores any filename it cannot parse, so
# `+thing.fixd.md` renders nothing, exits 0, and goes missing from the release
# with no complaint. Setting `ignore` flips that: anything in `changelog.d` that
# is neither a valid fragment nor named here fails the build and says which file.
# The two names below are the only non-fragments the directory is meant to hold.
ignore = [ ".gitkeep", "README.md" ]

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
